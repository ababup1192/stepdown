<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- ホーム画面に追加した時にアドレスバーの無いアプリとして開く。manifest とアイコンの行は書き出しが版を付けて足す。 -->
<!-- WhyNot: status-bar-style を black-translucent にしない — 縦持ちの頁がステータスバーの下まで伸び、パッドの時の canvas（top: 0）の上が隠れる。 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>片手間迷宮</title>
<style>
  :root { --fge-aspect: 1.7778; --fge-pad-min: 220px; --fge-side-min: 176px; --fge-edge: 24px; }
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; overflow: hidden; overscroll-behavior: none;
               touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
               -webkit-tap-highlight-color: transparent; font: 14px/1.5 system-ui, sans-serif; }
  /* WhyNot: 100vh にしない — スマホのブラウザでは 100vh がアドレスバーを隠した時の高さで、バーが出ている間は下がはみ出す。 */
  /* 切り欠き（ノッチ）の下へ canvas を入れない。PC では env() が 0 なので 100vw のまま。 */
  #fge-canvas { position: fixed; left: env(safe-area-inset-left); top: 0;
                width: calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right)); height: 100dvh; display: block; outline: none; }
  .fge-layer { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  /* ── 起動画面（絵は fge-web.js が #fge-splash に描く。色はデスクトップの Splash.flix と同じ）── */
  #fge-boot { background: #0b0e12; overflow: hidden; }
  #fge-splash { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #fge-start { position: absolute; left: 0; right: 0; top: 70%; display: flex; flex-direction: column; align-items: center;
               transform: translateY(-50%); color: #fff; font-size: 18px; font-weight: 600; letter-spacing: .08em;
               pointer-events: none; transition: opacity .2s ease-out; }
  #fge-start.fge-leaving { opacity: 0; }
  .fge-prompt { animation: fge-breathe 1.6s ease-in-out infinite; text-shadow: 0 1px 6px rgba(0, 0, 0, .6); }
  .fge-hint { position: relative; width: 3em; height: 3em; margin-bottom: .5em; }
  .fge-hand { position: absolute; inset: 0; width: 100%; height: 100%; fill: #fff; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .5));
              transform-origin: 48% 25%; animation: fge-press 1.6s infinite; }
  /* 輪の真ん中は指先（手の絵の 24 マスの (11.5, 6)）。 */
  .fge-ring { position: absolute; left: 48%; top: 25%; width: 1.6em; height: 1.6em; margin: -.8em 0 0 -.8em; border-radius: 50%;
              border: 2px solid rgba(255, 255, 255, .85); box-sizing: border-box; opacity: 0; animation: fge-ring 1.6s ease-out infinite; }
  .fge-ring + .fge-ring { animation-delay: .2s; }
  /* 1.6 秒の 1 回: 1.0 秒まで止まり、120ms で押し込み、200ms で行き過ぎながら戻る。輪は押し切った所から広がって消える。 */
  @keyframes fge-breathe { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes fge-press {
    0%, 62.5% { transform: translateY(0) scale(1); animation-timing-function: ease-in; }
    70% { transform: translateY(8%) scale(.86); animation-timing-function: cubic-bezier(.34, 1.8, .64, 1); }
    82.5%, 100% { transform: translateY(0) scale(1); }
  }
  @keyframes fge-ring {
    0%, 70% { transform: scale(.35); opacity: 0; }
    71% { transform: scale(.35); opacity: .9; }
    100% { transform: scale(1.9); opacity: 0; }
  }
  .fge-ripple { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .22); pointer-events: none;
                transform: scale(0); animation: fge-ripple .3s cubic-bezier(.4, 0, .2, 1) forwards; }
  @keyframes fge-ripple { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .fge-prompt { animation: none; }
    .fge-hint, .fge-ripple { display: none; }
  }
  #fge-end { background: rgba(0, 0, 0, .85); }
  #fge-end button, #fge-rotate button { font: inherit; font-size: 16px; padding: 10px 24px; }
  #fge-error { position: fixed; left: 8px; right: 8px; bottom: 8px; padding: 8px; background: #400; color: #fdd;
               white-space: pre-wrap; font: 12px/1.4 monospace; max-height: 40vh; overflow: auto; z-index: 30; }

  /* ── 向きの案内（指の端末で、ゲームの向きと違う時だけ）── */
  #fge-rotate { display: none; background: rgba(0, 0, 0, .94); z-index: 20; font-size: 18px; text-align: center; padding: 24px; }
  @media (orientation: portrait) {
    body.fge-touch.fge-want-landscape:not(.fge-rotate-ok) #fge-rotate { display: flex; }
  }
  @media (orientation: landscape) {
    body.fge-touch.fge-want-portrait:not(.fge-rotate-ok) #fge-rotate { display: flex; }
  }
  .fge-rotate-portrait, .fge-rotate-landscape { display: none; }
  body.fge-want-landscape .fge-rotate-landscape, body.fge-want-portrait .fge-rotate-portrait { display: block; }

  /* ── バーチャルパッド（指の端末で、ゲームが web.virtualPad を決めた時だけ。左のゾーンは十字キーか画面のスティック）── */
  #fge-pad { display: none; }
  body.fge-pad-on #fge-pad { display: block; }
  .fge-pad-zone { position: fixed; display: flex; align-items: center; box-sizing: border-box; touch-action: none; }
  .fge-dpad { position: relative; width: 150px; height: 150px; border-radius: 50%; background: rgba(255, 255, 255, .06); }
  .fge-dpad-arm { position: absolute; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
                  background: rgba(255, 255, 255, .16); border: 2px solid rgba(255, 255, 255, .3); color: rgba(255, 255, 255, .8);
                  font-size: 18px; box-sizing: border-box; }
  .fge-dpad-up { left: 50px; top: 0; border-radius: 10px 10px 4px 4px; }
  .fge-dpad-down { left: 50px; bottom: 0; border-radius: 4px 4px 10px 10px; }
  .fge-dpad-left { left: 0; top: 50px; border-radius: 10px 4px 4px 10px; }
  .fge-dpad-right { right: 0; top: 50px; border-radius: 4px 10px 10px 4px; }
  /* 2 個ずつで折り返す。WhyNot: 1 列に並べない — 縦持ちの右の欄は画面の幅の半分で、3 個目から左の十字キーの上へはみ出す。 */
  .fge-pad-buttons { display: flex; flex-direction: row-reverse; flex-wrap: wrap; align-items: flex-start; gap: 14px;
                     max-width: calc(2 * 68px + 14px); }
  .fge-pad-button { width: 68px; height: 68px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
                    background: rgba(255, 255, 255, .16); border: 2px solid rgba(255, 255, 255, .3); color: #fff;
                    font: bold 20px system-ui, sans-serif; box-sizing: border-box; }
  /* 右から 1 個目（A）を上に、2 個目（B）を左下に。ファミコンからの並び。 */
  .fge-pad-button-1 { margin-top: 34px; }
  .fge-pad-button-3 { margin-top: 34px; }
  .fge-dpad-arm.on, .fge-pad-button.on { background: rgba(255, 255, 255, .45); }
  /* 画面のスティック（web.virtualPad.stick）。指を置くと台がその所へ動く。置いていない間はゾーンの下寄りに薄く出す。 */
  /* WhyNot: 台で指を受けない（pointer-events: none）— 台は指に付いて動くので、ゾーンが受けないと台の外へ出た指を落とす。 */
  .fge-stick { position: relative; align-self: flex-end; margin-bottom: 12px; width: 140px; height: 140px; border-radius: 50%;
               background: rgba(255, 255, 255, .06); border: 2px solid rgba(255, 255, 255, .18); box-sizing: border-box;
               opacity: .55; pointer-events: none; transition: opacity .12s ease-out; }
  .fge-stick.on { opacity: 1; transition: none; }
  .fge-stick-knob { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
                    background: rgba(255, 255, 255, .16); border: 2px solid rgba(255, 255, 255, .3); box-sizing: border-box; }
  .fge-stick.on .fge-stick-knob { background: rgba(255, 255, 255, .45); }
  /* 置き場所を書いたスティックとボタン（canvas の上に重ねる 1 枚ずつ。位置と大きさは fge-web.js の fgePlacePad が design px から決める）。 */
  .fge-pad-place { position: fixed; touch-action: none; }
  /* WhyNot: align-self を残さない — 位置を決めた箱にも効き、上下の inset の間へ伸びずに下端へ寄って潰れる。 */
  .fge-pad-place > .fge-stick, .fge-pad-place > .fge-pad-button { position: absolute; width: auto; height: auto; margin: 0; align-self: auto; }
  .fge-pad-place .fge-stick-knob { left: 28%; top: 28%; width: 44%; height: 44%; margin: 0; }
  /* visible: false — ゲームの HUD の絵をそのまま使い、指を受ける当たりだけを残す。 */
  .fge-pad-ghost > * { visibility: hidden; }

  /* ── 縦の design で起動した時（WebLayer が縦を選んだ時だけ付く class）── */
  /* 縦の design は頁の上端と下端まで字とボタンを置くので、切り欠きとホームバーの内側に描く。横の design の縦持ちは帯の中央なので付けない。 */
  /* WhyNot: パッドの時は上の切り欠きを引かない — 縦持ちのパッドの canvas の高さは design の比から決まり、上を引くとパッドの置き場所の式と合わなくなる（今は縦の指定を持つパッドのゲームが無い）。 */
  @media (orientation: portrait) {
    body.fge-portrait-design:not(.fge-pad-on) #fge-canvas {
      top: env(safe-area-inset-top); height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
  }

  @media (orientation: portrait) {
    body.fge-pad-on { --fge-game-h: min(calc(100vw / var(--fge-aspect)), calc(100dvh - var(--fge-pad-min))); }
    body.fge-pad-on:not(.fge-pad-overlay) #fge-canvas { height: var(--fge-game-h); }
    body.fge-pad-on .fge-pad-zone { top: var(--fge-game-h); bottom: 0; width: 50vw;
                                    padding-bottom: env(safe-area-inset-bottom); }
    .fge-pad-left { left: 0; justify-content: flex-start; padding-left: max(var(--fge-edge), env(safe-area-inset-left)); }
    .fge-pad-right { right: 0; justify-content: flex-end; padding-right: max(var(--fge-edge), env(safe-area-inset-right)); }
  }
  @media (orientation: landscape) {

    body.fge-pad-on:not(.fge-pad-overlay) #fge-canvas { left: calc((100vw - var(--fge-game-w)) / 2); width: var(--fge-game-w); }
    body.fge-pad-on .fge-pad-zone { top: 0; bottom: 0; width: calc((100vw - var(--fge-game-w)) / 2);
                                    padding-top: 40px; padding-bottom: max(var(--fge-edge), env(safe-area-inset-bottom)); }
    .fge-pad-left { left: 0; justify-content: center; padding-left: max(var(--fge-edge), env(safe-area-inset-left)); }
    .fge-pad-right { right: 0; justify-content: center; padding-right: max(var(--fge-edge), env(safe-area-inset-right)); }
  }

// fge-switches.js — 頁の旗の読み手。URL の ?fge=<語>,<語>,… と、道具が頁より先に入れる window.fgeDev と、前の鍵（?fps=1 など）を 1 つの形にする。
// 書き出し（bin/fge export-web）が index.html の頭と sw.js に中身を埋める。字の決まりは docs/web-export.md の「頁の旗」。
// WhyNot: 頁の JS・頭の script・Service Worker のそれぞれで読まない — ?fge= の字の決まりが 3 つに分かれ、テーブルのテスト（testdata/web-switches.cases.json）を 1 本で流せない。
// WhyNot: 読み出しの関数の外で window を触らない — Service Worker（window が無い）にも同じ中身を埋める。
"use strict";

// 1 行 = 1 つの旗。field は window.fgeDev と読んだ結果の欄の名前・name は ?fge= の名前（小文字）・values は取れる値（無ければ真偽・"int" は正の整数）・
// short は値だけで書ける語・legacy は前の鍵（読んだら知らせる。sw だけは期限なしで知らせない。?fge= の後に足した旗は持たない）。

  { field: "fps", name: "fps", legacy: "fps" },
  { field: "backend", name: "backend", values: ["webgl2", "gl", "webgpu"], short: ["webgl2", "gl", "webgpu"], legacy: "backend" },
  { field: "net", name: "net", values: ["4g"], short: ["4g"], legacy: "net" },
  { field: "sw", name: "sw", values: ["0"], short: [], legacy: "sw", keep: true },
  { field: "input", name: "input", values: ["touch", "mouse"], short: ["touch", "mouse"], legacy: "input" },
  { field: "orientation", name: "orientation", values: ["portrait", "landscape"], short: ["portrait", "landscape"], legacy: "orientation" },
  { field: "size", name: "size", values: ["small", "medium", "large"], short: ["small", "medium", "large"], legacy: "size" },
  { field: "glcheck", name: "glcheck", legacy: "glcheck" },
  { field: "loadtime", name: "loadtime", legacy: "loadtime" },
  { field: "capture", name: "capture", values: "int", legacy: "capture" },
  { field: "deferred", name: "deferred", values: ["all"], short: [], legacy: "deferred" },
  { field: "usedAssets", name: "usedassets", legacy: "usedAssets" },
  { field: "webgpuFail", name: "webgpufail", values: ["prepare", "canvas"], short: [], legacy: "webgpuFail" },
  { field: "errors", name: "errors" },
  { field: "noworker", name: "noworker" }

function fgeSwitchDefaults() {

// 旗 s の字の値 raw を欄の値にする（読めなければ undefined）。前の鍵の真偽は "1" だけを真と読む。

function fgeSwitchOf(field) {
  return FGE_SWITCHES.filter(function (s) { return s.field === field; })[0];
}

// window.fgeDev の欄の値 v を欄の値にする（読めなければ undefined）。真偽と数はそのまま・字は ?fge= の値と同じ読み方。
function fgeSwitchDevValueOf(s, v) {

  return fgeSwitchValueOf(s, v);

// ?fge= の 1 語を { s, value } にする（知らない語は null）。

  var colon = w.indexOf(":");
  var name = colon < 0 ? w : w.slice(0, colon);
  for (var i = 0; i < FGE_SWITCHES.length; i++) {

    if (s.name !== name) continue;

// 頁の旗を読む。search は location.search の形（"?a=1&fge=fps"）・dev は window.fgeDev（無ければ null）。
// 返す物: switches（全部の欄）・legacy（読んだ前の鍵ごとに { from: "fps=1", to: "fps" }）・unknown（?fge= の知らない語）。
// 旗ごとに window.fgeDev → ?fge= → 前の鍵の順で、最初に値を持つ所を使う。同じ旗が ?fge= に 2 回あれば後の語。
// WhyNot: backend を順で上書きしない — WebGPU で落ちて開き直した頁は URL に webgl2 を持つ。fgeDev が別の値でも webgl2 を取らないと開き直しを繰り返す。
// WhyNot: 知らない語で止めない — 打ち間違いも、後の版の語を前の版の頁で開いた時も、旗が効かないだけで遊べる。

  var webgl2 = false;
  FGE_SWITCHES.forEach(function (s) {
    var old = s.legacy ? params.get(s.legacy) : null;
    var fromLegacy = old === null ? undefined : fgeSwitchValueOf(s, old);
    if (old !== null && !s.keep) legacy.push({ from: s.legacy + "=" + old, to: fgeSwitchWordFor(s, old) });
    var fromDev = dev ? fgeSwitchDevValueOf(s, dev[s.field]) : undefined;
    var picked = [fromDev, fromWords[s.field], fromLegacy].filter(function (v) { return v !== undefined; });
    if (s.field === "backend") webgl2 = picked.indexOf("webgl2") >= 0;
    if (picked.length > 0) out[s.field] = picked[0];

  out.backend = webgl2 ? "webgl2" : "";
  return { switches: out, legacy: legacy, unknown: unknown };
}

// 前の鍵の旗 s の値 raw に当たる ?fge= の語（前の鍵の知らせに出す）。
function fgeSwitchWordFor(s, raw) {
  var v = String(raw).toLowerCase();
  if (!s.values) return s.name;
  if (s.short && s.short.indexOf(v) >= 0) return v;
  return fgeSwitchValueOf(s, v) === undefined ? s.name + ":…" : s.name + ":" + v;
}

// search の ?fge= に word を足した search（前の鍵 drop は外す）。WebGPU で落ちた頁を webgl2 で開き直す時に使う。
function fgeSearchWithWord(search, word, drop) {
  var params = new URLSearchParams(search || "");
  var words = (params.get("fge") || "").split(",").map(function (w) { return w.trim(); }).filter(function (w) { return w.length > 0; });
  if (words.indexOf(word) < 0) words.push(word);
  params.set("fge", words.join(","));
  if (drop) params.delete(drop);
  return "?" + params.toString().replace(/%2C/gi, ",").replace(/%3A/gi, ":");

// この頁の旗（頁で 1 回だけ読む。頭の script と fge-web.js が同じ答えを使う）。
function fgePageSwitches() {
  if (!window.fgeSwitchesRead) window.fgeSwitchesRead = fgeReadSwitches(location.search, window.fgeDev || null);
  return window.fgeSwitchesRead;
}
